server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API: /api/x is forwarded to the backend's /x (the trailing
    # slash on proxy_pass strips the prefix), so the backend needs no CORS.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads: the backend enforces its own limit (MAX_UPLOAD_MB, default 50).
        client_max_body_size 64m;
        # Streamed chat answers must reach the browser as they are written.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
