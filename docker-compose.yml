services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-chatbot}
      UPLOAD_DIR: /app/data/uploads
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
      LLM_REASONING_MODEL: ${LLM_REASONING_MODEL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-}
      OCR_URL: ${OCR_URL:-}
      RERANK_URL: ${RERANK_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-}
      REFUSAL_MIN_SIMILARITY: ${REFUSAL_MIN_SIMILARITY:-}
      REFUSAL_MIN_KEYWORD_COVERAGE: ${REFUSAL_MIN_KEYWORD_COVERAGE:-}
      CHAT_HISTORY_TURNS: ${CHAT_HISTORY_TURNS:-}
      LLM_PRICE_FAST_PER_MTOK_IN: ${LLM_PRICE_FAST_PER_MTOK_IN:-}
      LLM_PRICE_FAST_PER_MTOK_OUT: ${LLM_PRICE_FAST_PER_MTOK_OUT:-}
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 30

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
  uploads:
