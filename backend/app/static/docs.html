         Scalar's own theme variables sit in @layer scalar-theme, so these unlayered
         rules win. tests/test_docs.py checks both colours against theme.css. -->
    <style>
      .light-mode {
        --scalar-color-accent: #2451cc;
      }
      .dark-mode {
        --scalar-color-accent: #8ab0ff;
      }

  <body>
    <!-- Both URLs are relative: behind the frontend's nginx this page is /api/docs and
         on port 8000 it is /docs, and each resolves against its own prefix.
         withDefaultFonts, proxyUrl and telemetry are the defaults of the pinned Scalar
         (app/static/SOURCES.md) that reach outside: its web font host and its request
         proxy. All three are off, so the page loads nothing but this origin's
         openapi.json and docs/scalar.js. No colour mode is set: Scalar follows the
         system, like the app and the favicon do. -->
    <script
      id="api-reference"
      data-url="openapi.json"
      data-configuration='{"withDefaultFonts": false, "proxyUrl": null, "telemetry": false}'
    ></script>
    <script src="docs/scalar.js"></script>
