[project]
name = "llm-pdf-chatbot-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "pgvector>=0.5.1",
    "psycopg[binary]",
    "pymupdf",
    "python-multipart",
    "sqlalchemy",
    "uvicorn",
]

[dependency-groups]
dev = ["httpx", "pytest", "pyyaml", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
