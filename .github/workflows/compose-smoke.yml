name: compose smoke

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: compose-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    # The repo variable CI_RUNS_ON (a JSON list of labels) picks the runner; unset means GitHub-hosted.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: pdf-chatbot-smoke-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/compose-smoke.sh

  proxy-compose:
    # docker-compose.proxy.yml parses and keeps its review-stack shape (docs/deploy/reverse-proxy.md).
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/proxy-compose-check.sh
