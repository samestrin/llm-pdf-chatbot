name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    # The repo variable CI_RUNS_ON (a JSON list of labels) picks the runner; unset means GitHub-hosted.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint -color

  backend:
    # The repo variable CI_RUNS_ON (a JSON list of labels) picks the runner; unset means GitHub-hosted.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    services:
      # The Postgres tests fail without it; they never skip.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        # A host port Docker picks, so parallel jobs on the shared runner do not collide.
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/test
      # The eval's subset: no scanned PDF (CI has no OCR), answered by the fake model.
      - run: uv run python -m evals.run --subset
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/test

  frontend:
    # The repo variable CI_RUNS_ON (a JSON list of labels) picks the runner; unset means GitHub-hosted.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Browser tests: chromium only; the API is mocked by route fixtures.
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
